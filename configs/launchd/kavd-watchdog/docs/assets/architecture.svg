<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">kavd-watchdog local architecture</title>
  <desc id="desc">make build compiles the binary as the user, and make install copies it with the plist as root:wheel. launchd keeps kavd-watchdog running as root. Every 60 seconds the watchdog reads kavd CPU, and after 5 checks at or above 150 percent it asks launchd to kickstart kavd, at most once per hour.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#161616"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="#888" stroke-width="1.2"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="#3291ff" stroke-width="1.2"/>
    </marker>
    <style>
      .sans { font-family: Geist, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .fg { fill: #ededed; }
      .muted { fill: #a1a1a1; }
      .dim { fill: #666; }
      .blue { fill: #3291ff; }
      .eyebrow { font-size: 10px; letter-spacing: 1.2px; fill: #666; }
      .req { stroke: #888; stroke-width: 1; fill: none; }
      .copy { stroke: #555; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
      .restart { stroke: #3291ff; stroke-width: 1.2; fill: none; }
      .badge { fill: #000; stroke: #3291ff; stroke-width: 1; }
      .badge-num { font-size: 11px; font-weight: 600; fill: #3291ff; }
    </style>
  </defs>

  <rect width="1280" height="820" fill="#000"/>
  <rect width="1280" height="820" fill="url(#dots)"/>

  <text x="56" y="64" class="sans fg" font-size="24" font-weight="600" letter-spacing="-0.5">kavd-watchdog</text>
  <text x="56" y="90" class="sans muted" font-size="14">Local LaunchDaemon architecture on macOS</text>

  <g class="mono" font-size="11">
    <line x1="884" y1="60" x2="912" y2="60" class="req" marker-end="url(#arrow)"/>
    <text x="922" y="64" class="muted">run, read</text>
    <line x1="1000" y1="60" x2="1028" y2="60" class="copy"/>
    <text x="1038" y="64" class="muted">copy</text>
    <line x1="1086" y1="60" x2="1114" y2="60" class="restart" marker-end="url(#arrow-blue)"/>
    <text x="1124" y="64" class="muted">restart</text>
  </g>

  <rect x="56.5" y="140.5" width="300" height="200" rx="12" fill="#0a0a0a" stroke="#2e2e2e"/>
  <text x="80" y="170" class="mono eyebrow">BUILD  AS YOU</text>
  <text x="80" y="196" class="sans fg" font-size="16" font-weight="600">Repository</text>
  <circle cx="330" cy="191" r="10" class="badge"/>
  <text x="330" y="195" class="mono badge-num" text-anchor="middle">1</text>
  <line x1="57" y1="214.5" x2="356" y2="214.5" stroke="#2e2e2e"/>
  <text x="80" y="240" class="mono muted" font-size="12">configs/launchd/kavd-watchdog</text>
  <text x="80" y="262" class="mono fg" font-size="12">make build</text>
  <text x="80" y="280" class="mono dim" font-size="11">cargo build --release</text>
  <rect x="80.5" y="296.5" width="252" height="30" rx="6" fill="#000" stroke="#2e2e2e"/>
  <text x="92" y="316" class="mono fg" font-size="11">target/release/kavd-watchdog</text>

  <line x1="206" y1="341" x2="206" y2="396" class="req" marker-end="url(#arrow)"/>
  <circle cx="230" cy="368" r="10" class="badge"/>
  <text x="230" y="372" class="mono badge-num" text-anchor="middle">2</text>
  <text x="250" y="372" class="mono dim" font-size="10">make install</text>

  <rect x="56.5" y="400.5" width="300" height="200" rx="12" fill="#0a0a0a" stroke="#2e2e2e"/>
  <text x="80" y="430" class="mono eyebrow">INSTALL  AS ROOT</text>
  <text x="80" y="456" class="sans fg" font-size="16" font-weight="600">install.sh</text>
  <line x1="57" y1="474.5" x2="356" y2="474.5" stroke="#2e2e2e"/>
  <text x="80" y="500" class="mono muted" font-size="12">osascript admin prompt</text>
  <text x="80" y="522" class="mono muted" font-size="12">install -o root -g wheel</text>
  <text x="80" y="544" class="mono muted" font-size="12">launchctl bootout, bootstrap</text>
  <text x="80" y="576" class="mono dim" font-size="11">never runs cargo as root</text>

  <path d="M357 440 H398 V280 H436" class="copy"/>
  <text x="366" y="432" class="mono dim" font-size="10">copy</text>

  <rect x="440.5" y="140.5" width="360" height="460" rx="12" fill="#0a0a0a" stroke="#2e2e2e"/>
  <circle cx="468" cy="181" r="4" fill="#50e3c2"/>
  <text x="482" y="186" class="sans fg" font-size="16" font-weight="600">launchd</text>
  <text x="776" y="186" class="mono muted" font-size="11" text-anchor="end">system domain  PID 1</text>
  <line x1="441" y1="206.5" x2="800" y2="206.5" stroke="#2e2e2e"/>

  <rect x="464.5" y="226.5" width="312" height="160" rx="8" fill="#000" stroke="#2e2e2e"/>
  <text x="480" y="250" class="mono eyebrow">JOB</text>
  <text x="480" y="272" class="mono fg" font-size="13">local.kavd-watchdog</text>
  <rect x="480.5" y="286.5" width="84" height="22" rx="11" fill="none" stroke="#2e2e2e"/>
  <text x="522" y="301" class="mono muted" font-size="11" text-anchor="middle">RunAtLoad</text>
  <rect x="572.5" y="286.5" width="80" height="22" rx="11" fill="none" stroke="#2e2e2e"/>
  <text x="612" y="301" class="mono muted" font-size="11" text-anchor="middle">KeepAlive</text>
  <text x="480" y="334" class="mono dim" font-size="11">/usr/local/libexec/kavd-watchdog</text>
  <text x="480" y="352" class="mono dim" font-size="11">/Library/LaunchDaemons/</text>
  <text x="480" y="368" class="mono dim" font-size="11">local.kavd-watchdog.plist</text>

  <rect x="464.5" y="410.5" width="312" height="166" rx="8" fill="#000" stroke="#2e2e2e"/>
  <text x="480" y="434" class="mono eyebrow">JOB</text>
  <text x="480" y="456" class="mono fg" font-size="13">com.kaspersky.kav.kavd</text>
  <text x="480" y="480" class="sans muted" font-size="13">Kaspersky Anti-Virus for Mac</text>
  <text x="480" y="504" class="mono dim" font-size="11">kavd.app/Contents/MacOS/kavd</text>

  <rect x="880.5" y="140.5" width="344" height="260" rx="12" fill="#3291ff" fill-opacity="0.06" stroke="#3291ff"/>
  <circle cx="908" cy="181" r="4" fill="#3291ff"/>
  <text x="922" y="186" class="sans fg" font-size="16" font-weight="600">kavd-watchdog</text>
  <text x="1200" y="186" class="mono muted" font-size="11" text-anchor="end">root  Rust</text>
  <line x1="881" y1="206.5" x2="1224" y2="206.5" stroke="#2e2e2e"/>
  <g class="mono" font-size="12">
    <text x="904" y="234" class="dim">interval</text>
    <text x="1000" y="234" class="fg">60s, CPU averaged</text>
    <text x="904" y="258" class="dim">threshold</text>
    <text x="1000" y="258" class="fg">&gt;= 150%</text>
    <text x="904" y="282" class="dim">sustain</text>
    <text x="1000" y="282" class="fg">5 checks in a row</text>
    <text x="904" y="306" class="dim">cooldown</text>
    <text x="1000" y="306" class="fg">1 restart per hour</text>
  </g>
  <line x1="881" y1="324.5" x2="1224" y2="324.5" stroke="#2e2e2e"/>
  <g class="mono" font-size="11">
    <text x="904" y="350" class="dim">log</text>
    <text x="1000" y="350" class="muted">/var/log/kavd-watchdog.log</text>
    <text x="904" y="374" class="dim">state</text>
    <text x="1000" y="374" class="muted">in memory only</text>
  </g>

  <rect x="880.5" y="460.5" width="344" height="140" rx="12" fill="#0a0a0a" stroke="#2e2e2e"/>
  <circle cx="908" cy="501" r="4" fill="#ee0000"/>
  <text x="922" y="506" class="sans fg" font-size="16" font-weight="600">kavd</text>
  <text x="1200" y="506" class="mono muted" font-size="11" text-anchor="end">root</text>
  <line x1="881" y1="526.5" x2="1224" y2="526.5" stroke="#2e2e2e"/>
  <text x="904" y="554" class="sans muted" font-size="13">Real-time scan, pinned on CPU</text>
  <text x="904" y="576" class="mono dim" font-size="11">relaunched by launchd, never killed directly</text>

  <line x1="801" y1="260" x2="876" y2="260" class="req" marker-end="url(#arrow)"/>
  <text x="838" y="252" class="mono dim" font-size="10" text-anchor="middle">spawn</text>
  <circle cx="838" cy="280" r="10" class="badge"/>
  <text x="838" y="284" class="mono badge-num" text-anchor="middle">3</text>

  <line x1="1052" y1="401" x2="1052" y2="456" class="req" marker-end="url(#arrow)"/>
  <circle cx="1030" cy="430" r="10" class="badge"/>
  <text x="1030" y="434" class="mono badge-num" text-anchor="middle">4</text>
  <text x="1066" y="434" class="mono dim" font-size="10">read CPU</text>

  <path d="M880 370 H842 V470 H805" class="restart" marker-end="url(#arrow-blue)"/>
  <circle cx="842" cy="412" r="10" class="badge"/>
  <text x="842" y="416" class="mono badge-num" text-anchor="middle">5</text>
  <text x="858" y="440" class="mono blue" font-size="10">kickstart -k</text>

  <line x1="801" y1="540" x2="876" y2="540" class="req" marker-end="url(#arrow)"/>
  <text x="838" y="532" class="mono dim" font-size="10" text-anchor="middle">relaunch</text>
  <circle cx="838" cy="560" r="10" class="badge"/>
  <text x="838" y="564" class="mono badge-num" text-anchor="middle">6</text>

  <rect x="56.5" y="640.5" width="1168" height="150" rx="12" fill="#0a0a0a" stroke="#2e2e2e"/>
  <text x="80" y="668" class="mono eyebrow">FLOW</text>
  <g class="sans muted" font-size="13">
    <circle cx="90" cy="696" r="10" class="badge"/>
    <text x="90" y="700" class="mono badge-num" text-anchor="middle">1</text>
    <text x="110" y="701">make build compiles a release binary as you</text>
    <circle cx="476" cy="696" r="10" class="badge"/>
    <text x="476" y="700" class="mono badge-num" text-anchor="middle">2</text>
    <text x="496" y="701">make install copies it and the plist as root:wheel</text>
    <circle cx="862" cy="696" r="10" class="badge"/>
    <text x="862" y="700" class="mono badge-num" text-anchor="middle">3</text>
    <text x="882" y="701">launchd keeps kavd-watchdog running</text>
    <circle cx="90" cy="746" r="10" class="badge"/>
    <text x="90" y="750" class="mono badge-num" text-anchor="middle">4</text>
    <text x="110" y="751">Every 60s it reads kavd CPU over the window</text>
    <circle cx="476" cy="746" r="10" class="badge"/>
    <text x="476" y="750" class="mono badge-num" text-anchor="middle">5</text>
    <text x="496" y="751">5 checks at &gt;= 150% run kickstart -k, once per hour</text>
    <circle cx="862" cy="746" r="10" class="badge"/>
    <text x="862" y="750" class="mono badge-num" text-anchor="middle">6</text>
    <text x="882" y="751">launchd stops and relaunches kavd</text>
  </g>
</svg>
